version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: jpassbolt_db
    environment:
      POSTGRES_DB: jpassbolt
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      # Loopback only — local dev services must not be reachable from the network.
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
