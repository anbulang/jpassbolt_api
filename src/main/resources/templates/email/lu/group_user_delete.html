<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--
  Sent to a member removed from a group on update (GroupUserDeleteEmailRedactor).
  Variables: actorName; groupName; link (SPA groups page). The whole <body> is
  replaced by the shared shell.
-->
<body th:replace="~{_layout :: shell(#{email.group.user.delete.title}, ~{::content})}">
<div th:fragment="content">
  <p th:text="#{email.group.user.delete.intro(${actorName},${groupName})}">
    You were removed from a group.
  </p>
  <p th:text="#{email.group.user.delete.body}">
    You no longer have access to the group's passwords.
  </p>
  <p style="margin:24px 0;">
    <a th:href="${link}" th:text="#{email.group.cta}"
       style="background:#2a6df4;color:#fff;text-decoration:none;padding:12px 20px;border-radius:8px;font-weight:600;display:inline-block;">
      View in JPassbolt
    </a>
  </p>
  <p style="color:#888;font-size:12px;word-break:break-all;"
     th:text="#{email.button.fallback(${link})}">
    Or open this link: ...
  </p>
</div>
</body>
</html>
