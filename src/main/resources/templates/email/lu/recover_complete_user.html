<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--
  Sent to a user who completed account recovery (RecoverCompleteUserEmailRedactor).
  Variables: clientIp; userAgent (both gated by th:if not-empty); link (SPA user
  page). The whole <body> is replaced by the shared shell.
-->
<body th:replace="~{_layout :: shell(#{email.recover.complete.user.title}, ~{::content})}">
<div th:fragment="content">
  <p th:text="#{email.recover.complete.user.intro}">
    You just completed an account recovery.
  </p>
  <p th:if="${userAgent != null and !userAgent.isEmpty()}">
    <strong th:text="#{email.field.userAgent}">User Agent</strong>:
    <span th:text="${userAgent}">...</span>
  </p>
  <p th:if="${clientIp != null and !clientIp.isEmpty()}">
    <strong th:text="#{email.field.userIp}">User IP</strong>:
    <span th:text="${clientIp}">...</span>
  </p>
  <p style="margin:24px 0;">
    <a th:href="${link}" th:text="#{email.recover.complete.cta}"
       style="background:#2a6df4;color:#fff;text-decoration:none;padding:12px 20px;border-radius:8px;font-weight:600;display:inline-block;">
      View user in JPassbolt
    </a>
  </p>
  <p style="color:#888;font-size:12px;word-break:break-all;"
     th:text="#{email.button.fallback(${link})}">
    Or open this link: ...
  </p>
</div>
</body>
</html>
