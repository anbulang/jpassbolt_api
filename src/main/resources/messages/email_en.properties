# Transactional email copy (English).
# Loaded by config.MailMessageConfig (ResourceBundleMessageSource, UTF-8)
# and consumed by service.email.MailService, which renders these per-recipient
# locale resolved via AccountLocaleService. Body fragments fill the shared
# wrap()/button() HTML scaffold. Args: {0} is the recovery/setup link where used.

# --- shared scaffold ---
email.footer=JPassbolt — end-to-end encrypted password manager

# --- account recovery (sendRecoverEmail) ---
email.recover.subject=Your account recovery, {0}
email.recover.title=Account recovery
email.recover.intro=You requested to recover access to your JPassbolt vault.
email.recover.instruction=Make sure you have your <strong>private key backup</strong> at hand, then continue:
email.recover.cta=Recover my account
email.recover.ignore=If you didn't request this, you can ignore this email. The link expires and can be used once.

# --- setup invite (sendSetupInviteEmail) ---
email.invite.subject=Welcome to JPassbolt, {0}!
email.invite.title=Welcome to JPassbolt
email.invite.intro=An account was created for you. Finish setting it up to start using your vault:
email.invite.intro.admin={0} created an account for you on JPassbolt. Finish setting it up to start using your vault:
email.invite.cta=Set up my account

# --- button helper (shared) ---
email.button.fallback=Or open this link: {0}

# --- resource shared (lu/resource_share) ---
# {0} = actor display name, {1} = resource name
email.resource.share.subject={0} shared a password with you
email.resource.share.title=A password was shared with you
email.resource.share.intro={0} shared the password "{1}" with you. You can now find it in your vault.
email.resource.share.intro.noname={0} shared a password with you. You can now find it in your vault.
email.resource.share.cta=Open in JPassbolt

# --- shared field labels (optional content disclosures, default-off) ---
email.field.username=Username
email.field.uri=URL
email.field.description=Description
email.field.secret=Encrypted password

# --- comment added (lu/comment_add) --- {0}=actor display name, {1}=resource name
email.comment.add.subject={0} commented on {1}
email.comment.add.subject.noname={0} commented on a password
email.comment.add.title=New comment
email.comment.add.intro={0} commented on the password "{1}".
email.comment.add.intro.noname={0} commented on a password you have access to.
email.comment.add.cta=View in JPassbolt

# --- user deleted (lu/user_delete, to group managers) --- {0}=actor, {1}=deleted user
email.user.delete.subject={0} deleted user {1}
email.user.delete.title=A user you manage was deleted
email.user.delete.intro=The user {0} ({1}) has been deleted from your organization.
email.user.delete.groups=This user was a member of one or more groups you manage.
email.user.delete.cta=Log in to JPassbolt

# --- administrator deleted (lu/admin_delete, to all admins) ---
email.admin.delete.subject={0} deleted administrator {1}
email.admin.delete.subject.self=You deleted administrator {0}
email.admin.delete.title=An administrator was deleted
email.admin.delete.intro={0} deleted the administrator {1} ({2}) from JPassbolt.
email.admin.delete.intro.self=You deleted the administrator {0}.
email.admin.delete.suspicious=Get in touch with the administrator at the origin of this operation if it looks suspicious.
email.admin.delete.cta=Log in to JPassbolt

# --- group: member added (lu/group_user_add: update-add + create) --- {0}=actor, {1}=group
email.group.user.add.subject={0} added you to the group {1}
email.group.user.add.title=You were added to a group
email.group.user.add.intro={0} added you to the group "{1}".
email.group.user.add.body=As a member of this group you now have access to all the passwords shared with it.
email.group.user.add.manager=As a group manager you can also add and remove members.
email.group.cta=View in JPassbolt

# --- group: member removed (lu/group_user_delete) ---
email.group.user.delete.subject={0} removed you from the group {1}
email.group.user.delete.title=You were removed from a group
email.group.user.delete.intro={0} removed you from the group "{1}".
email.group.user.delete.body=You no longer have access to the passwords shared with this group.

# --- group: membership updated (lu/group_user_update) ---
email.group.user.update.subject={0} updated your membership in the group {1}
email.group.user.update.title=Your group membership changed
email.group.user.update.intro={0} updated your membership in the group "{1}".
email.group.user.update.promoted=You are now a group manager and can add and remove members.
email.group.user.update.member=You are now a regular member of this group.

# --- group: manager change summary (lu/group_summary) ---
email.group.manager.update.subject={0} updated the group {1}
email.group.manager.update.title=A group you manage was updated
email.group.manager.update.intro={0} updated the membership of the group "{1}".
email.group.summary.added=Added members:
email.group.summary.updated=Updated members:
