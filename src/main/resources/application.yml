server:
  # 8090 is the canonical local port (the 8080 era predates the dual-context
  # skeleton pages); override with SERVER_PORT. Keep full-base-url below in
  # sync — email links and the JWT issuer derive from it, not from the request.
  port: ${SERVER_PORT:8090}
  # Bind loopback only by default: local dev servers must not be reachable from
  # the network (security-baseline requirement). Production deployments behind
  # a reverse proxy override this with the SERVER_ADDRESS environment variable.
  address: ${SERVER_ADDRESS:127.0.0.1}
  # Reverse-proxy client-IP / scheme resolution (official passbolt.security.proxies).
  # OFF by default to match CE's proxies.active=false: X-Forwarded-* are only trusted
  # when a deployment behind a controlled proxy sets this to "framework" (so
  # getRemoteAddr() returns the real client IP that lands in notification emails).
  # Never enable it unless every hop is a proxy YOU control, or clients can spoof it.
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:none}
  servlet:
    context-path: /api

spring:
  application:
    name: jpassbolt_api
  datasource:
    # Secrets are NEVER committed: inject the connection through environment
    # variables (or an external secret store). The committed defaults are
    # non-functional placeholders — the previously committed remote MySQL
    # credentials must be considered leaked and rotated.
    url: ${JPASSBOLT_DB_URL:jdbc:mysql://localhost:3306/jpassbolt?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&allowPublicKeyRetrieval=true}
    username: ${JPASSBOLT_DB_USERNAME:jpassbolt}
    password: ${JPASSBOLT_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  
logging:
  level:
    org.springframework.web: DEBUG
    com.jpassbolt.api: DEBUG

jpassbolt:
  # Browser-facing links in emails (recovery/setup) and the skeleton page must
  # point at the trusted server domain the user actually browses. By default
  # PublicBaseUrlResolver DERIVES this from the request, gated against Host-header
  # injection: only loopback / *.localhost / hosts listed in app.trusted-hosts are
  # honored, otherwise it falls back to settings.full-base-url. In production set
  # app.public-base-url to the public origin (recommended), or add the public
  # hostname(s) to app.trusted-hosts.
  app:
    public-base-url: ${JPASSBOLT_APP_PUBLIC_BASE_URL:}
    trusted-hosts: ${JPASSBOLT_APP_TRUSTED_HOSTS:}
  # Outbound email. Disabled by default: when off (or when no JavaMailSender bean
  # is configured, i.e. spring.mail.host unset), MailService LOGS the link instead
  # of sending — so default/test profiles need no SMTP. The `local` profile turns
  # this on and points spring.mail at a local MailHog.
  email:
    enabled: ${JPASSBOLT_EMAIL_ENABLED:false}
    from: ${EMAIL_DEFAULT_FROM:${JPASSBOLT_EMAIL_FROM:no-reply@jpassbolt.local}}
  auth:
    register-token-expiry-days: 10   # 对照 PHP PASSBOLT_AUTH_REGISTER_TOKEN_EXPIRY 默认 '10 days'
    recover-token-expiry-days: 10    # 对照 PHP PASSBOLT_AUTH_RECOVER_TOKEN_EXPIRY 默认 '10 days'
  security:
    # Mirror official passbolt.security.preventEmailEnumeration
    # (config/default.php: env PASSBOLT_SECURITY_PREVENT_EMAIL_ENUMERATION,
    # default FALSE). When false (official default) POST /users/recover.json
    # answers 404 for an unknown/deleted/disabled email, so the client shows the
    # "requires an invitation" screen — the official CE default the plugin
    # renders. Set true to hide account existence (always 200 "check your
    # email"), which is the more private but non-default behaviour.
    prevent-email-enumeration: ${PASSBOLT_SECURITY_PREVENT_EMAIL_ENUMERATION:false}
  jwt:
    # Legacy HS256 secret — no longer used for signing (RS256 key pair below);
    # still read by HealthcheckService (core.salt). Inject via env, never commit.
    secret: ${JPASSBOLT_LEGACY_HMAC_SECRET:}
    # Access token lifetime. Aligned to the official CE default of 5 minutes
    # (PASSBOLT_AUTH_JWT_ACCESS_TOKEN '5 minutes') to shrink the stolen-token
    # window; the refresh token (30 days below) transparently renews it.
    expiration: 300000 # 5 minutes
    # RS256 key pair. NO key pair is bundled with the repository anymore (the
    # previously committed jwt.key/jwt.pem must be considered leaked and were
    # removed/rotated). Deployments MUST inject a deployment-specific pair via
    # these locations (file: or classpath:); startup fails fast otherwise.
    # Only the local/test profiles may opt into an ephemeral in-memory dev key
    # (allow-ephemeral-dev-key: true).
    private-key-location: ${JPASSBOLT_JWT_PRIVATE_KEY_LOCATION:}
    public-key-location: ${JPASSBOLT_JWT_PUBLIC_KEY_LOCATION:}
    allow-ephemeral-dev-key: false
    refresh-token-expiry-days: 30   # PHP RefreshTokenAbstractService default
    verify-token-expiry-hours: 1    # PHP VerifyTokenCreateService default
  gpg:
    server-key:
      private-location: ${JPASSBOLT_GPG_PRIVATE_KEY_LOCATION:classpath:gpg/server_private.asc}
      public-location: ${JPASSBOLT_GPG_PUBLIC_KEY_LOCATION:classpath:gpg/server_public.asc}
      # Inject via env; the committed dev key's passphrase only lives in the
      # local/test profiles.
      passphrase: ${JPASSBOLT_GPG_PASSPHRASE:}
  # Backend API / server version, surfaced by HealthcheckService
  # (info.currentVersion / remoteVersion). Distinct on purpose from
  # settings.version-number below, which is the bundled web-extension
  # (webapp) version — same split as official Passbolt, where the server and
  # the browser extension version independently.
  version: 4.9.0
  healthcheck:
    index-endpoint-enabled: true
  # v5 metadata onboarding flags (official passbolt.plugins.metadata.*), consumed
  # by the GET /metadata/settings/getting-started + /metadata/setup/settings probes.
  # Both default true like CE; set false to suppress the encrypted-metadata prompts.
  metadata:
    enable-for-new-instances: ${PASSBOLT_PLUGINS_METADATA_ENABLE_FOR_NEW_INSTANCES:true}
    enable-for-existing-instances: ${PASSBOLT_PLUGINS_METADATA_ENABLE_FOR_EXISTING_INSTANCES:true}
  # GET /user-key-policies/settings.json — preferred user key generation
  # parameters. Defaults mirror the official UserKeyPoliciesSettingsDto
  # constants (ECC). For RSA set preferred-key-type: rsa,
  # preferred-key-size: 3072|4096 and preferred-key-curve: "" instead.
  user-key-policies:
    preferred-key-type: curve
    preferred-key-size: ""
    preferred-key-curve: curve25519_legacy+ed25519_legacy
  settings:
    # The ONE public origin (official App.fullBaseUrl semantics, same env var
    # name). Every outbound email link is built from this value — deliberately
    # NOT from the request Host — so async redactor emails and CLI contexts
    # produce identical links. Changing it invalidates issued RS256 JWTs (iss).
    full-base-url: ${APP_FULL_BASE_URL:http://localhost:8090}
    edition: ce
    # Web-extension (webapp) version reported by GET /settings.json — the
    # version the plugin checks for its own UI/compatibility. Intentionally
    # different from jpassbolt.version above (the backend/server version).
    version-number: "5.7.2"
    version-name: "Gnossienne No. 1"
    privacy-policy-url: ""
    terms-url: https://www.passbolt.com/terms
    # Capability switchboard rendered as passbolt.plugins.<name>.enabled by
    # GET /settings.json. Entries here merge over the code defaults in
    # SettingsProperties.defaultPlugins() (same values listed for
    # documentation). Only advertise endpoint clusters that really exist —
    # the official extension calls whatever is advertised.
    plugins:
      jwtAuthentication: true
      previewPassword: true
      multiFactorAuthentication: true
      selfRegistration: true
      smtpSettings: true
      folders: true
      resourceTypes: true
      totpResourceTypes: true
      metadata: true
      passwordPolicies: true
      passwordGenerator: true
      emailNotificationSettings: true
      accountSettings: true
      locale: true
      disableUser: true
      userKeyPolicies: true
      healthcheck: true
      healthcheckUi: true
      log: true
      inFormIntegration: true
      accountRecoveryRequestHelp: true
      export: false
      import: false
      mobile: false
      desktop: false
      rbacs: false
      passwordExpiry: false
      secretRevisions: false
      emailDigest: false
      reports: false
