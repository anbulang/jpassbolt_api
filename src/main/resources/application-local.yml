spring:
  datasource:
    # NON_KEYWORDS: organization_settings.value and the future groups table collide with H2 reserved words
    url: jdbc:h2:mem:jpassbolt;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;NON_KEYWORDS=GROUPS,VALUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
  # SMTP transport — configured entirely via env vars / config file (no admin UI
  # needed), the same model as Passbolt CE's EMAIL_TRANSPORT_DEFAULT_* Docker vars
  # (https://www.passbolt.com/docs/hosting/install/ce/docker/). Both the Passbolt
  # names and JPASSBOLT_SMTP_* aliases are accepted; the secret (password) is only
  # ever supplied via env — never committed here.
  #
  # Default (no env set): MailHog (docker run -p 1025:1025 -p 8025:8025 mailhog/mailhog;
  # captured mail at http://localhost:8025).
  #
  # 163 example (port 465 = implicit SSL):
  #   EMAIL_TRANSPORT_DEFAULT_HOST=smtp.163.com
  #   EMAIL_TRANSPORT_DEFAULT_PORT=465
  #   EMAIL_TRANSPORT_DEFAULT_USERNAME=anbulang@163.com
  #   EMAIL_TRANSPORT_DEFAULT_PASSWORD=<163 authorization code>
  #   EMAIL_DEFAULT_FROM=anbulang@163.com
  #   JPASSBOLT_SMTP_AUTH=true
  #   JPASSBOLT_SMTP_SSL=true         # 465 = implicit SSL; for 587 use JPASSBOLT_SMTP_STARTTLS=true instead
  mail:
    host: ${EMAIL_TRANSPORT_DEFAULT_HOST:${JPASSBOLT_SMTP_HOST:localhost}}
    port: ${EMAIL_TRANSPORT_DEFAULT_PORT:${JPASSBOLT_SMTP_PORT:1025}}
    username: ${EMAIL_TRANSPORT_DEFAULT_USERNAME:${JPASSBOLT_SMTP_USERNAME:}}
    password: ${EMAIL_TRANSPORT_DEFAULT_PASSWORD:${JPASSBOLT_SMTP_PASSWORD:}}
    properties:
      mail:
        smtp:
          auth: ${JPASSBOLT_SMTP_AUTH:false}
          starttls:
            enable: ${JPASSBOLT_SMTP_STARTTLS:false}
          ssl:
            enable: ${JPASSBOLT_SMTP_SSL:false}

jpassbolt:
  # Turn on real email sending in local dev (captured by MailHog above).
  email:
    enabled: true
  jwt:
    # Local development only: generate an ephemeral in-memory RS256 pair at
    # startup instead of requiring an externally injected key pair.
    allow-ephemeral-dev-key: true
  gpg:
    server-key:
      # Passphrase of the committed DEV-ONLY server key (gpg/server_private.asc).
      passphrase: password
